name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pm_user
          POSTGRES_PASSWORD: pm_password
          POSTGRES_DB: pm_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_pgsql, redis, mbstring, xml, ctype, iconv, intl
        coverage: xdebug

    - name: Validate composer.json
      run: composer validate --strict

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Generate JWT keys
      run: |
        mkdir -p config/jwt
        openssl genrsa -out config/jwt/private.pem 4096
        openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem

    - name: Run migrations
      env:
        DATABASE_URL: "postgresql://pm_user:pm_password@localhost:5432/pm_db_test?serverVersion=15&charset=utf8"
      run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

    - name: Run PHPUnit
      env:
        DATABASE_URL: "postgresql://pm_user:pm_password@localhost:5432/pm_db_test?serverVersion=15&charset=utf8"
        REDIS_URL: "redis://localhost:6379"
      run: php bin/phpunit --coverage-text

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build
